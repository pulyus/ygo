    });
    $("groupName").addEventListener("blur", (e) => {
      const g = activeGroup();
      if (!g) return;
      g.name = cleanName(e.target.value, MAX_GROUP_NAME).trim() || DEFAULT_GROUP;
      e.target.value = g.name;
      renderGroupList();
      saveSoon();
    });
    $("groupName").addEventListener("keydown", (e) => {
      if (e.key == "Enter") e.target.blur();
    });

    //--- phones: three screens ---
    const isPhone = () => window.matchMedia("(max-aspect-ratio: 1/1)").matches;
    function showScreen(name) {
      document.body.classList.remove("scr-groups", "scr-cards", "scr-search");
      document.body.classList.add("scr-" + name);
      for (const b of $("tabs").querySelectorAll("button")) b.classList.toggle("selected", b.dataset.screen == name);
      window.scrollTo(0, 0);
    }
    $("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b) showScreen(b.dataset.screen);
    });
    showScreen("groups");

    //=== mouse: click, click and hold, drag and drop ===
    const HOLD_MS = 500;
    const DRAG_PX = 6;
    const isMac = /Mac/.test(navigator.platform);
    let lastPointerType = "mouse";
    let press = null; //a card pressed with the mouse
    let gdrag = null; //a group row being dragged by its handle
    document.addEventListener("pointerdown", (e) => (lastPointerType = e.pointerType), true);

    //right click (or Ctrl+click on a Mac) opens the context menu
    function isSecondary(e) {
      return e.button != 0 || (isMac && e.ctrlKey);
    }
    document.addEventListener("pointerdown", (e) => {
      if (e.pointerType != "mouse" || isSecondary(e)) return;
      const cell = e.target.closest(".cell[data-name]");
      if (!cell) return;
      press = { cell, name: cell.dataset.name, loc: cell.dataset.loc, idx: Number(cell.dataset.idx || 0), x: e.clientX, y: e.clientY, moved: false, hold: false };
      press.timer = setTimeout(() => {
        if (press && !press.moved) {
          press.hold = true;
          showInfo(press.name);
        }
      }, HOLD_MS);
    });
    document.addEventListener("pointermove", (e) => {
      if (gdrag) return groupDragMove(e);
      if (!press || press.hold) return;
      if (!press.moved) {
        if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < DRAG_PX) return;
        press.moved = true;
        clearTimeout(press.timer);
        startGhost();
      }
      moveGhost(e);
    });
    document.addEventListener("pointercancel", () => {
      if (gdrag) groupDragEnd();
      if (press) {
        clearTimeout(press.timer);
        endGhost();
        press = null;
      }
    });
    document.addEventListener("pointerup", (e) => {
      if (gdrag) return groupDragEnd(e);
      if (!press) return;
      const p = press;
      press = null;
      clearTimeout(p.timer);
      if (p.hold) return closeInfoPopup();
      if (p.moved) {
        const drop = dropTarget(e);
        endGhost();
        return handleDrop(p, drop, e);
      }
      shortClick(p.name, p.loc, p.idx, p.cell);
    });
    //touch screens: a tap
    document.addEventListener("click", (e) => {
      if (lastPointerType == "mouse") return;
      const cell = e.target.closest(".cell[data-name]");
      if (cell) shortClick(cell.dataset.name, cell.dataset.loc, Number(cell.dataset.idx || 0), cell);
    });
    function shortClick(name, loc, idx, cell) {
      if (state.mode == "view") return showInfo(name);
      if (loc == "search") {
        addCard(name);
      } else {
        const g = activeGroup();
        if (g) {
          removeCopy(g, name, idx);
          changed();
        }
      }
    }
    document.addEventListener("contextmenu", (e) => {
      const cell = e.target.closest(".cell[data-name]");
      const row = e.target.closest(".group-row");
      if (cell) {
        e.preventDefault();
        if (e.pointerType == "touch" || lastPointerType == "touch") return showInfo(cell.dataset.name);
        clearTimeout(press && press.timer);
        press = null;
        const g = activeGroup();
        //edit mode: right click on a card of the group adds another copy of it
        if (state.mode == "edit" && cell.dataset.loc == "group" && g) {
          addCopyAfter(g, cell.dataset.name, Number(cell.dataset.idx));
          changed();
        } else {
          showInfo(cell.dataset.name);
        }
      } else if (row) {
        e.preventDefault();
        openMenu(e.clientX, e.clientY, Number(row.dataset.id));
      }
    });

    //--- the card that follows the cursor ---
    function startGhost() {
      const ghost = $("ghost");
      const img = press.cell.querySelector("img");
      ghost.style.width = press.cell.getBoundingClientRect().width + "px";
      ghost.innerHTML = "";
      ghost.appendChild(img.cloneNode());
      ghost.style.display = "block";
      press.cell.classList.add("lifted");
      document.body.classList.add("dragging");
    }
    function moveGhost(e) {
      const ghost = $("ghost");
      ghost.style.left = e.clientX - ghost.offsetWidth / 2 + "px";
      ghost.style.top = e.clientY - ghost.offsetHeight / 2 + "px";
      const t = dropTarget(e);
      for (const r of document.querySelectorAll(".group-row.drop")) r.classList.remove("drop");
      $("groupCards").classList.toggle("dropbox", t.kind == "cards");
      const tip = $("dropTip");
      if (t.kind == "row" && !(press.loc == "group" && t.group === activeGroup())) {
        t.row.classList.add("drop");
        const all = e.shiftKey && state.stacked && press.loc == "group";
        const q = esc(t.group.name);
        tip.innerHTML =
          press.loc == "search"
            ? `Add to <b>${q}</b>`
            : `Move ${all ? "all copies" : "one copy"} to <b>${q}</b>${state.stacked && !all ? ` <span>· Shift: all copies</span>` : ""}`;
        tip.style.display = "block";
        tip.style.left = Math.min(e.clientX + 16, window.innerWidth - tip.offsetWidth - 4) + "px";
        tip.style.top = e.clientY + 22 + "px";
      } else {
        tip.style.display = "none";
      }
    }
    function endGhost() {
      $("ghost").style.display = "none";
      $("dropTip").style.display = "none";
      document.body.classList.remove("dragging");
      $("groupCards").classList.remove("dropbox");
      for (const r of document.querySelectorAll(".group-row.drop")) r.classList.remove("drop");
      for (const c of document.querySelectorAll(".cell.lifted")) c.classList.remove("lifted");
    }
    //what is under the cursor: a group row, the group's card box, the search results, or nothing
    function dropTarget(e) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (!el) return { kind: "none" };
      const row = el.closest(".group-row");
      if (row) return { kind: "row", row, group: groupById(row.dataset.id) };
      if (el.closest("#groupCards")) return { kind: "cards" };
      if (el.closest("#searchResult")) return { kind: "search" };
      return { kind: "none" };
    }
    //display position in the group's card box for a drop at (x, y): cards in rows above, plus cards in the row left of it
    function dropIndexAt(e, skipCell) {
      let index = 0;
      for (const cell of $("groupCards").querySelectorAll(".cell")) {
        if (cell === skipCell) continue;
        const r = cell.getBoundingClientRect();
        if (r.bottom <= e.clientY || (r.top <= e.clientY && r.left + r.width / 2 < e.clientX)) index++;
      }
      return index;
    }
    function handleDrop(p, drop, e) {
      const g = activeGroup();
      if (drop.kind == "row" && drop.group) {
        if (p.loc == "search") return addCard(p.name, drop.group.id);
        if (!g || drop.group === g) return;
        const n = e.shiftKey && state.stacked ? countOf(g, p.name) : 1;
        for (let i = 0; i < n; i++) {
          addToOther(drop.group, p.name);
          removeCopy(g, p.name, p.idx);
        }
        return changed();
      }
      if (drop.kind == "cards") {
        const to = dropIndexAt(e, p.loc == "group" ? p.cell : null);
        if (p.loc == "search") return addCard(p.name, null, to);
        if (g) {
          moveEntry(g, p.idx, to);
          changed();
        }
        return;
      }
      if (drop.kind == "search" && p.loc == "group" && g) {
        removeCopy(g, p.name, p.idx);
        changed();
      }
    }

    //--- reordering the groups with the handle ---
    $("groupList").addEventListener("pointerdown", (e) => {
      const grip = e.target.closest(".grip");
      if (!grip || isSecondary(e) || $("groupFilter").value) return;
      const row = grip.closest(".group-row");
      gdrag = { id: Number(row.dataset.id), row, before: undefined };
      row.classList.add("moving");
      document.body.classList.add("dragging");
      e.preventDefault();
    });
    function groupDragMove(e) {
      const rows = [...$("groupList").querySelectorAll(".group-row")];
      for (const r of rows) r.classList.remove("before", "after");
      let target = null;
      for (const r of rows) {
        const b = r.getBoundingClientRect();
        if (e.clientY < b.top + b.height / 2) {
          target = r;
          break;
        }
      }
      if (target) target.classList.add("before");
      else if (rows.length) rows[rows.length - 1].classList.add("after");
      gdrag.before = target ? Number(target.dataset.id) : null;
    }
    function groupDragEnd() {
      const d = gdrag;
      gdrag = null;
      document.body.classList.remove("dragging");
      d.row.classList.remove("moving");
      for (const r of $("groupList").querySelectorAll(".group-row")) r.classList.remove("before", "after");
      if (d.before !== undefined && d.before !== d.id) moveGroup(d.id, d.before);
    }
    //a click on a group row opens it; a double click renames it
    $("groupList").addEventListener("click", (e) => {
      if (e.target.closest(".grip")) return;
      const row = e.target.closest(".group-row");
      if (row) selectGroup(Number(row.dataset.id), true);
    });
    $("groupList").addEventListener("dblclick", (e) => {
      if (e.target.closest(".grip")) return;
      const row = e.target.closest(".group-row");
      if (row) {
        selectGroup(Number(row.dataset.id), true);
        focusGroupName();
      }
    });

    //--- right-click menu on a group ---
    function openMenu(x, y, id) {
      const g = groupById(id);
      if (!g) return;
      const m = $("menu");
      m.innerHTML = `<button data-a="rename">Rename</button><button data-a="dup">Duplicate</button><button data-a="del" class="del">Delete</button>`;
      m.style.display = "block";
      m.style.left = Math.min(x, window.innerWidth - m.offsetWidth - 4) + "px";
      m.style.top = Math.min(y, window.innerHeight - m.offsetHeight - 4) + "px";
      m.onclick = (ev) => {
        const b = ev.target.closest("button");
        if (!b) return;
        closeMenu();
        state.activeId = g.id;
        renderAll();
        if (b.dataset.a == "rename") focusGroupName();
        else if (b.dataset.a == "dup") duplicateGroup();
        else askDeleteGroup(g);
      };
    }
    function closeMenu() {
      $("menu").style.display = "none";
    }
    document.addEventListener("pointerdown", (e) => {
      if (!e.target.closest("#menu")) closeMenu();
    }, true);

    //=== popups: copy / download / upload / confirmations ===
    const layer = $("exportLayer");
    //o: { title, hint (html), seg: [{label, selected, disabled, onSelect}], list: [[left, right]], choices: [{label, desc, notes, selected, danger, keep, onSelect}] }
    function openPopup(o) {
      $("exportTitle").textContent = o.title;
      const root = $("exportOptions");
      root.innerHTML = "";
      if (o.hint) {
        const p = document.createElement("p");
        p.className = "export-hint";
        p.innerHTML = o.hint;
        root.appendChild(p);
      }
      if (o.seg) {
        const seg = document.createElement("div");
        seg.className = "seg";
        for (const s of o.seg) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = s.label;
          b.className = s.selected ? "selected" : "";
          b.disabled = !!s.disabled;
          b.addEventListener("click", s.onSelect);
          seg.appendChild(b);
        }
        root.appendChild(seg);
      }
      if (o.list) {
        const l = document.createElement("div");
        l.className = "importlist";
        l.innerHTML = o.list.map((r) => `<div><span>${esc(r[0])}</span><span class="muted">${esc(r[1])}</span></div>`).join("");
        root.appendChild(l);
      }
      for (const c of o.choices || []) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "export-option" + (c.selected ? " selected" : "") + (c.danger ? " danger" : "");
        b.innerHTML = `${esc(c.label)}${c.desc ? `<span class="export-desc">${esc(c.desc)}</span>` : ""}${(c.notes || []).map((n) => `<span class="export-note">${esc(n)}</span>`).join("")}`;
        b.addEventListener("click", () => {
          if (!c.keep) closePopup();
          if (c.onSelect) c.onSelect();
        });
        root.appendChild(b);
      }
      layer.classList.add("open");
      (root.querySelector(".export-option.selected") || $("exportBox")).focus();
    }
    function closePopup() {
      layer.classList.remove("open");
    }
    layer.addEventListener("click", (e) => {
      if (e.target === layer) closePopup();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key != "Escape") return;
      closePopup();
      closeMenu();
      if (popupKind == "info") closeInfoPopup();
      else if (popupKind == "filter") {
        closeInfoPopup();
        runSearch();
      }
    });

    //--- export ---
    const sanitizeFile = (s, fallback) => String(s).replace(/[\\/:*?"<>|]/g, "").trim() || fallback;
    function collectionData() {
      return { name: state.name || DEFAULT_COLLECTION, groups: state.groups.map((g) => ({ name: g.name, cards: g.cards })) };
    }
    //"#main / #extra / !side" list of one group, which editor.html and YgolDeck understand
    function groupNamelist(g) {
      let main = "#main\n", extra = "#extra\n";
      for (const n of g.cards) {
        if (isExtra(n)) extra += n + "\n";
        else main += n + "\n";
      }
      return main + extra + "!side\n";
    }
    function collectionNamelist() {
      return (
        `#collection ${state.name}\n\n` +
        state.groups.map((g) => `#group ${g.name}\n${g.cards.join("\n")}${g.cards.length ? "\n" : ""}`).join("\n")
      );
    }
    function hasKonamiID(name) {
      return !!(cardMap.get(name) || {}).konamiID;
    }
    const missingFromIndex = (cards) => [...new Set(cards)].filter((n) => !codec.index.has(n));
    //what an export would leave out or change, for the notes in the popup
    function exportNotes(scope, fmt, g) {
      const notes = [];
      if (fmt == "ylcc" || fmt == "yld") {
        const cards = scope == "all" ? state.groups.flatMap((x) => x.cards) : g.cards;
        const n = missingFromIndex(cards).length;
        if (n) notes.push(`${n} ${n == 1 ? "card is" : "cards are"} not in the card index and will be left out.`);
      }
      if (scope == "one" && (fmt == "ydk" || fmt == "ydke")) {
        const n = g.cards.filter((c) => !hasKonamiID(c)).length;
        if (n) notes.push(`${n} ${n == 1 ? "card has" : "cards have"} no Konami ID and will be left out.`);
      }
      if (scope == "one") {
        const many = [...new Set(g.cards)].filter((c) => countOf(g, c) > 3).length;
        if (many) notes.push(`${many} ${many == 1 ? "card has" : "cards have"} more than 3 copies; editor.html keeps 3 when it opens this.`);
      }
      return notes;
    }
    function exportText(scope, fmt) {
      const g = activeGroup();
      codec.missing = [];
      if (scope == "all") {
        if (fmt == "ylcc") return { text: codec.encode(collectionData()), ext: ".ylcc", skipped: codec.missing.slice(), file: sanitizeFile(state.name, DEFAULT_COLLECTION) };
        return { text: collectionNamelist(), ext: ".txt", skipped: [], file: sanitizeFile(state.name, DEFAULT_COLLECTION) };
      }
      let list = groupNamelist(g);
      const file = sanitizeFile(g.name, DEFAULT_GROUP);
      if (fmt == "ydk" || fmt == "ydke") {
        const skip = new Set(g.cards.filter((c) => !hasKonamiID(c)));
        list = list.split("\n").filter((a) => !skip.has(a)).join("\n");
      }
      if (fmt == "names") return { text: groupNamelist(g), ext: ".txt", skipped: [], file };
      const skipped = fmt == "yld" ? missingFromIndex(g.cards) : [];
      const text = ygolDeck.convert(list, fmt);
      return { text, ext: fmt == "ydke" ? ".txt" : "." + fmt, skipped, file };
    }
    function openExport(action, scope = "all") {
      if (!dataReady) return;
      const g = activeGroup();
      if (scope == "one" && !g) scope = "all";
      const formats =
        scope == "all"
          ? [
              { id: "ylcc", label: "YLCC", desc: "YGO Lightning card collection code. Keeps every group, its name, the collection name and the order of the cards." },
              { id: "names", label: "Card names", desc: "Every group as a #group line followed by one card name per line." },
            ]
          : [
              { id: "yld", label: "YLD", desc: "YGO Lightning deck code, for editor.html." },
              { id: "ydke", label: "YDKE", desc: "Deck code for YGOPro-based simulators." },
              { id: "ydk", label: "YDK", desc: "Deck file for YGOPro-based simulators." },
              { id: "names", label: "Card names", desc: "One card name per line, in sections." },
            ];
      const verb = action == "copy" ? "Copy" : "Download";
      openPopup({
        title: `${verb} as`,
        seg: [
          { label: `Whole collection · ${state.groups.length} ${state.groups.length == 1 ? "group" : "groups"}`, selected: scope == "all", onSelect: () => openExport(action, "all") },
          { label: g ? `Open group · ${g.name.length > 18 ? g.name.slice(0, 17) + "…" : g.name}` : "Open group", selected: scope == "one", disabled: !g, onSelect: () => openExport(action, "one") },
        ],
        choices: formats.map((f, i) => ({
          label: f.label,
          desc: f.desc,
          notes: state.groups.length || scope == "all" ? exportNotes(scope, f.id, g) : [],
          selected: i == 0,
          onSelect: () => (action == "copy" ? copyAs(scope, f) : downloadAs(scope, f)),
        })),
      });
    }
    function reportSkipped(skipped) {
      if (!skipped.length) return;
      const counts = {};
      for (const n of skipped) counts[n] = (counts[n] || 0) + 1;
      let lines = Object.entries(counts).map(([n, c]) => `- ${n}${c > 1 ? ` x${c}` : ""}`);
      if (lines.length > 20) lines = lines.slice(0, 20).concat(`...and ${lines.length - 20} more`);
      alert(`${skipped.length} card(s) are not in the card index, so they were left out of the code:\n${lines.join("\n")}`);
    }
    async function copyAs(scope, f) {
      let r;
      try {
        r = exportText(scope, f.id);
      } catch (e) {
        return alert("Error: This could not be exported.");
      }
      let ok = false;
      try {
        await navigator.clipboard.writeText(r.text);
        ok = true;
      } catch (e) {
        const input = document.createElement("textarea");
        input.value = r.text;
        document.body.appendChild(input);
        input.select();
        ok = document.execCommand("copy");
        document.body.removeChild(input);
      }
      const btn = $("copyDeck");
      btn.textContent = ok ? `Copied ${f.label}!` : "Copy failed";
      setTimeout(() => (btn.textContent = "Copy"), 2000);
      reportSkipped(r.skipped);
    }
    function downloadAs(scope, f) {
      let r;
      try {
        r = exportText(scope, f.id);
      } catch (e) {
        return alert("Error: This could not be exported.");
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([r.text], { type: "text/plain" }));
      a.download = r.file + r.ext;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      reportSkipped(r.skipped);
    }
    $("copyDeck").addEventListener("click", () => openExport("copy"));
    $("download").addEventListener("click", () => openExport("download"));

    //--- import ---
    $("upload").addEventListener("click", () => {
      if (!dataReady) return;
      openPopup({
        title: "Upload from",
        choices: [
          { label: "File", desc: ".ylcc, .yld, .ydk or .txt", onSelect: () => $("uploadInput").click() },
          { label: "Clipboard", onSelect: uploadFromClipboard },
        ],
      });
    });
    $("uploadInput").addEventListener("change", (e) => {
      const input = e.target;
      const file = input.files[0];
      input.value = "";
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => importText(reader.result, file.name.replace(/\.(ylcc|yld|ydk|ydke|txt)$/i, ""), "file");
      reader.readAsText(file);
    });
    async function uploadFromClipboard() {
      let text = null;
      try {
        text = await navigator.clipboard.readText();
      } catch (e) {
        //the browser blocked reading the clipboard (not https, or permission refused)
      }
      if (text === null) return openPasteBox();
      if (!text.trim()) return alert("The clipboard is empty.");
      importText(text, null, "clipboard");
    }
    function openPasteBox() {
      $("exportTitle").textContent = "Paste code";
      const root = $("exportOptions");
      root.innerHTML = "";
      const hint = document.createElement("p");
      hint.className = "export-hint";
      hint.textContent = "Your browser didn't allow reading the clipboard. Paste the code here (Ctrl+V), then press Load.";
      const box = document.createElement("textarea");
      box.setAttribute("aria-label", "Collection code, deck code or card list");
      const load = document.createElement("button");
      load.type = "button";
      load.className = "export-option";
      load.textContent = "Load";
      load.addEventListener("click", () => {
        if (!box.value.trim()) return box.focus();
        closePopup();
        importText(box.value, null, "clipboard");
      });
      root.append(hint, box, load);
      layer.classList.add("open");
      box.focus();
    }
    //which kind of text this is
    function detectKind(text) {
      if (/ylcc:\/\//.test(text)) return "ylcc";
      if (/^#(collection|group)\b/m.test(text)) return "names";
      return "deck";
    }
    //a "#collection / #group" card name list
    function parseNames(text) {
      const col = { name: "", groups: [] };
      const missing = [];
      let cur = null;
      for (const raw of text.split("\n")) {
        const line = raw.trim();
        if (!line) continue;
        if (/^#collection\b/.test(line)) col.name = line.slice(11).trim();
        else if (/^#group\b/.test(line)) {
          cur = { name: line.slice(6).trim() || DEFAULT_GROUP, cards: [] };
          col.groups.push(cur);
        } else {
          if (!cur) {
            cur = { name: "Imported cards", cards: [] };
            col.groups.push(cur);
          }
          if (cardMap.has(line)) cur.cards.push(line);
          else missing.push(line);
        }
      }
      return { col, missing };
    }
    //one deck (yld, ydk, ydke, dlf2p code or card names): all its cards, side deck included
    function parseDeck(text) {
      ygolDeck.missing = [];
      const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
      //a plain list of card names (no codes, no sections)
      const namelist = lines.every((l) => cardMap.has(l)) ? lines.join("\n") : ygolDeck.convert(text, "namelist");
      if (typeof namelist != "string") throw new Error("unreadable");
      const cards = [];
      const missing = ygolDeck.missing.slice();
      for (const raw of namelist.split("\n")) {
        const line = raw.trim();
        if (!line || line[0] == "#" || line[0] == "!") continue;
        if (cardMap.has(line)) cards.push(line);
        else missing.push(line);
      }
      if (!cards.length) throw new Error("no cards");
      return { cards, missing };
    }
    function importText(raw, fileName, source) {
      const text = raw.replace(/\r\n?/g, "\n").trim();
      const fail = (msg) =>
        alert(msg || (source == "clipboard" ? "Error: The clipboard doesn't contain a code or card list this page can read." : "Error: This file isn't one this page can read."));
      if (!text) return fail();
      try {
        const kind = detectKind(text);
        if (kind == "ylcc") {
          const code = text.match(/ylcc:\/\/[A-Za-z0-9\-_]+(\.[A-Za-z0-9\-_]*)?/)[0];
          const col = codec.decode(code);
          return askImportCollection(col, codec.missing.slice(), fileName);
        }
        if (kind == "names") {
          const { col, missing } = parseNames(text);
          if (!col.groups.some((g) => g.cards.length) && missing.length) throw new Error("no cards");
          return askImportCollection(col, missing, fileName);
        }
        const { cards, missing } = parseDeck(text);
        return askImportDeck(cards, missing, fileName || "Imported deck");
      } catch (e) {
        fail(/newer version/.test(e.message) ? "Error: " + e.message : null);
      }
    }
    function skippedNote(missing) {
      return missing.length ? [`${missing.length} ${missing.length == 1 ? "card is" : "cards are"} not in the card database and will be skipped.`] : [];
    }
    function askImportCollection(col, missing, fileName) {
      const n = col.groups.length;
      const cards = col.groups.reduce((s, g) => s + g.cards.length, 0);
      const have = state.groups.length;
      //nothing on the page to keep: replace straight away instead of asking
      if (!have) return applyCollection(col, "replace", missing);
      openPopup({
        title: `Import ${n} ${n == 1 ? "group" : "groups"}?`,
        hint: `${col.name ? `“${esc(col.name)}” has` : "This code has"} <b>${n} ${n == 1 ? "group" : "groups"}</b> and <b>${cards}</b> cards.`,
        list: col.groups.map((g) => [g.name, g.cards.length]),
        choices: [
          {
            label: "Add to my collection",
            desc: have ? `Keeps your ${have} ${have == 1 ? "group" : "groups"} and adds ${n == 1 ? "this one" : "these " + n}.` : "Adds the groups to your collection.",
            notes: ["A group whose name is already used gets (2) added.", ...skippedNote(missing)],
            selected: true,
            onSelect: () => applyCollection(col, "add", missing),
          },
          {
            label: "Replace my collection",
            desc: "Removes your current groups first.",
            notes: have ? [`Your ${have} ${have == 1 ? "group" : "groups"} (${totalCards()} cards) will be lost.`] : [],
            onSelect: () => applyCollection(col, "replace", missing),
          },
          { label: "Cancel" },
        ],
      });
    }
    function applyCollection(col, mode, missing) {
      if (mode == "replace") {
        state.groups = [];
        state.activeId = null;
        state.name = cleanName(col.name, MAX_COLLECTION_NAME) || DEFAULT_COLLECTION;
      } else if ((!state.name.trim() || state.name == DEFAULT_COLLECTION) && cleanName(col.name, MAX_COLLECTION_NAME).trim()) {
        //adding to a collection that has no name yet: it takes the uploaded collection's name
        state.name = cleanName(col.name, MAX_COLLECTION_NAME).trim();
      }
      let first = null;
      for (const g of col.groups) {
        const added = makeGroup(uniqueGroupName(cleanName(g.name, MAX_GROUP_NAME) || DEFAULT_GROUP), g.cards.slice());
        state.groups.push(added);
        first = first || added;
      }
      if (first) state.activeId = first.id;
      $("collectionName").value = state.name;
      $("groupFilter").value = "";
      changed();
      if (isPhone()) showScreen("groups");
      reportMissing(missing);
    }
    function askImportDeck(cards, missing, name) {
      const g = activeGroup();
      const info = `<b>${cards.length}</b> ${cards.length == 1 ? "card" : "cards"} (${new Set(cards).size} different) in “${esc(name)}”.`;
      openPopup({
        title: "Import deck?",
        hint: info,
        choices: [
          {
            label: "Add as a new group",
            desc: `A group named “${name}”.`,
            notes: skippedNote(missing),
            selected: true,
            onSelect: () => {
              const added = makeGroup(uniqueGroupName(cleanName(name, MAX_GROUP_NAME) || DEFAULT_GROUP), cards.slice());
              state.groups.push(added);
              state.activeId = added.id;
              $("groupFilter").value = "";
              changed();
              reportMissing(missing);
            },
          },
          ...(g
            ? [
                {
                  label: "Add to the open group",
                  desc: `The cards go into “${g.name}”.`,
                  notes: skippedNote(missing),
                  onSelect: () => {
                    g.cards.push(...cards);
                    changed();
                    reportMissing(missing);
                  },
                },
              ]
            : []),
          { label: "Cancel" },
        ],
      });
    }
    function reportMissing(missing) {
      if (!missing.length) return;
      const counts = {};
      for (const n of missing) counts[n] = (counts[n] || 0) + 1;
      let lines = Object.entries(counts).map(([n, c]) => `- ${n}${c > 1 ? ` x${c}` : ""}`);
      if (lines.length > 20) lines = lines.slice(0, 20).concat(`...and ${lines.length - 20} more`);
      alert(`${missing.length} card(s) are not in the card database and were skipped:\n${lines.join("\n")}`);
    }

    //=== saving in the browser ===
    let saveTimer = null;
    function saveSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 300);
    }
    function saveNow() {
      clearTimeout(saveTimer);
      if (!dataReady) return;
      try {
        const data = {
          v: 1,
          name: state.name,
          stacked: state.stacked,
          active: state.groups.findIndex((g) => g.id === state.activeId),
          groups: state.groups.map((g) => {
            const runs = []; //[name, copies] for neighbours that are the same card
            for (const n of g.cards) {
              const last = runs[runs.length - 1];
              if (last && last[0] === n) last[1]++;
              else runs.push([n, 1]);
            }
            return { name: g.name, cards: runs };
          }),
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        //storage blocked or full: the page still works, it just won't remember
      }
    }
    window.addEventListener("pagehide", saveNow);
    function loadSaved() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!data || data.v != 1 || !Array.isArray(data.groups)) return;
        state.name = cleanName(data.name || "", MAX_COLLECTION_NAME) || DEFAULT_COLLECTION;
        state.stacked = data.stacked !== false;
        state.groups = data.groups.map((g) =>
          makeGroup(
            cleanName(g.name || "", MAX_GROUP_NAME) || DEFAULT_GROUP,
            (g.cards || []).flatMap(([n, c]) => (cardMap.has(n) ? Array(Math.max(0, Math.floor(c))).fill(n) : []))
          )
        );
        const a = state.groups[data.active];
        state.activeId = a ? a.id : state.groups.length ? state.groups[0].id : null;
      } catch (e) {
        //unreadable saved data: start empty
      }
    }

    //=== start ===
    function addScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("Could not load " + src));
        document.head.appendChild(s);
      });
    }
    async function start() {
      setMode("view");
      $("collectionName").value = state.name;
      renderAll();
      $("searchResult").innerHTML = `<div class="emptynote">Loading card data...</div>`;
      try {
        await Promise.all(["data/ygolDb.js", "data/ygolID.js"].map(addScript));
      } catch (e) {
        $("groupCards").innerHTML = `<div class="emptynote">${esc(e.message)}.<br>Keep this page in the same folder as editor.html.</div>`;
        return;
      }
      for (const c of cardDb) if (!cardMap.has(c.name)) cardMap.set(c.name, c);
      searchIndex = cardDb.map((c) => (c.name + "\n" + c.description).toLowerCase());
      ygolDeck = new YgolDeck(cardDb, ygolID, false);
      codec = new YgolCollection(ygolID, (n) => cardMap.has(n));
      dataReady = true;
      loadSaved();
      $("collectionName").value = state.name;
      renderAll();
      runSearch();
      //a collection or deck in the page address: ?ylcc=<code> or ?yld=<code>
      const params = new URL(window.location.href).searchParams;
      const code = params.get("ylcc") ? "ylcc://" + params.get("ylcc") : params.get("yld") ? "yld://" + params.get("yld") : null;
      if (code) {
        history.replaceState(null, "", window.location.pathname);
        importText(code, null, "clipboard");
      }
    }
    start();
  </script>
  <script src="data/ygol-nav.js"></script>
</html>
